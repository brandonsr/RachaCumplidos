<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racha de Cumplidos</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2d6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cumplidos">
<meta name="mobile-web-app-capable" content="yes">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #2d1b4e, #4a2d6b, #7b3f6b);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
    padding-bottom: 40px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    margin: 0;
    font-size: 26px;
  }
  .streak-banner {
    text-align: center;
    background: rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 14px;
    margin: 16px auto;
    max-width: 500px;
    backdrop-filter: blur(6px);
  }
  .streak-number {
    font-size: 42px;
    font-weight: bold;
    color: #ffd166;
  }
  .today-status {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    font-size: 14px;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
  }
  .badge.done {
    background: #4caf50;
  }
  .columns {
    display: flex;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
    flex-wrap: wrap;
  }
  .column {
    flex: 1;
    min-width: 280px;
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(6px);
  }
  .column h2 {
    text-align: center;
    margin-top: 0;
    padding-bottom: 8px;
    border-bottom: 2px solid rgba(255,255,255,0.2);
  }
  textarea {
    width: 100%;
    min-height: 70px;
    border-radius: 10px;
    border: none;
    padding: 10px;
    font-size: 14px;
    resize: vertical;
    font-family: inherit;
  }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #ff6f91;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #888;
    cursor: not-allowed;
  }
  .entries {
    margin-top: 14px;
    max-height: 300px;
    overflow-y: auto;
  }
  .entry {
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .entry-date {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .loading { text-align: center; opacity: 0.7; padding: 20px; }
  .reset-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.6;
    cursor: pointer;
  }

  /* Install popup */
  .install-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 999;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .install-card {
    background: #2d1b4e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px 20px 0 0;
    max-width: 480px;
    width: 100%;
    padding: 22px 20px 26px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
    animation: slideUp 0.3s ease;
  }
  @media (min-width: 520px) {
    .install-overlay { align-items: center; }
    .install-card { border-radius: 20px; }
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .install-icon-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .install-icon-row img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
  }
  .install-card h3 {
    margin: 0 0 4px;
    font-size: 17px;
  }
  .install-card p {
    margin: 0;
    font-size: 13px;
    opacity: 0.75;
  }
  .install-steps {
    margin: 16px 0;
    font-size: 14px;
    line-height: 1.6;
  }
  .install-steps .step {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .step-num {
    background: rgba(255,255,255,0.15);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .install-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .install-actions button {
    margin-top: 0;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.12) !important;
  }
</style>
</head>
<body>

<div class="header">
  <h1>💌 Racha de Cumplidos</h1>
  <p style="opacity:0.8; font-size:14px;">Un cumplido al día mantiene la racha viva</p>
</div>

<div class="streak-banner" id="streakBanner">
  <div class="loading">Cargando racha...</div>
</div>

<div class="columns">
  <div class="column">
    <h2>💜 Tanya</h2>
    <textarea id="input-tanya" placeholder="Escribe un cumplido para Saúl..."></textarea>
    <button id="btn-tanya">Enviar cumplido</button>
    <div class="entries" id="entries-tanya"></div>
  </div>
  <div class="column">
    <h2>💙 Saúl</h2>
    <textarea id="input-saul" placeholder="Escribe un cumplido para Tanya..."></textarea>
    <button id="btn-saul">Enviar cumplido</button>
    <div class="entries" id="entries-saul"></div>
  </div>
</div>

<div class="reset-link" id="resetLink">Reiniciar datos (borra todo)</div>

<!-- Install popup, injected dynamically -->
<div id="installOverlay"></div>

<script>
const PEOPLE = ['tanya', 'saul'];

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function dateDiffDays(a, b) {
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}

async function getEntries(person) {
  try {
    const res = await window.storage.get('entries:' + person, true);
    return res ? JSON.parse(res.value) : [];
  } catch (e) {
    return [];
  }
}

async function saveEntries(person, entries) {
  await window.storage.set('entries:' + person, JSON.stringify(entries), true);
}

async function getStreakData() {
  try {
    const res = await window.storage.get('streak-data', true);
    return res ? JSON.parse(res.value) : { streak: 0, lastCompleteDate: null };
  } catch (e) {
    return { streak: 0, lastCompleteDate: null };
  }
}

async function saveStreakData(data) {
  await window.storage.set('streak-data', JSON.stringify(data), true);
}

function renderEntries(person, entries) {
  const container = document.getElementById('entries-' + person);
  if (entries.length === 0) {
    container.innerHTML = '<div class="loading">Sin cumplidos todavía</div>';
    return;
  }
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date) || b.time - a.time);
  container.innerHTML = sorted.map(e => `
    <div class="entry">
      <div class="entry-date">${formatDate(e.date)}</div>
      <div>${escapeHtml(e.text)}</div>
    </div>
  `).join('');
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function hasEntryToday(person) {
  const entries = await getEntries(person);
  const today = todayStr();
  return entries.some(e => e.date === today);
}

async function updateStreakBanner() {
  const banner = document.getElementById('streakBanner');
  const tanyaToday = await hasEntryToday('tanya');
  const saulToday = await hasEntryToday('saul');
  const streakData = await getStreakData();

  banner.innerHTML = `
    <div class="streak-number">🔥 ${streakData.streak}</div>
    <div style="font-size:14px; opacity:0.85;">días seguidos de cumplidos mutuos</div>
    <div class="today-status">
      <span class="badge ${tanyaToday ? 'done' : ''}">${tanyaToday ? '✅' : '⏳'} Tanya</span>
      <span class="badge ${saulToday ? 'done' : ''}">${saulToday ? '✅' : '⏳'} Saúl</span>
    </div>
  `;
}

async function checkAndUpdateStreak() {
  const tanyaToday = await hasEntryToday('tanya');
  const saulToday = await hasEntryToday('saul');
  const today = todayStr();

  let streakData = await getStreakData();

  if (tanyaToday && saulToday) {
    if (streakData.lastCompleteDate === today) return;
    if (streakData.lastCompleteDate) {
      const diff = dateDiffDays(streakData.lastCompleteDate, today);
      if (diff === 1) {
        streakData.streak += 1;
      } else if (diff > 1) {
        streakData.streak = 1;
      }
    } else {
      streakData.streak = 1;
    }
    streakData.lastCompleteDate = today;
    await saveStreakData(streakData);
  } else {
    if (streakData.lastCompleteDate && streakData.lastCompleteDate !== today) {
      const diff = dateDiffDays(streakData.lastCompleteDate, today);
      if (diff > 1) {
        streakData.streak = 0;
        streakData.lastCompleteDate = null;
        await saveStreakData(streakData);
      }
    }
  }
}

async function submitCompliment(person) {
  const textarea = document.getElementById('input-' + person);
  const text = textarea.value.trim();
  if (!text) return;

  const btn = document.getElementById('btn-' + person);
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const entries = await getEntries(person);
  entries.push({ text, date: todayStr(), time: Date.now() });
  await saveEntries(person, entries);

  textarea.value = '';
  renderEntries(person, entries);
  await checkAndUpdateStreak();
  await updateStreakBanner();

  btn.disabled = false;
  btn.textContent = 'Enviado 💌';
  setTimeout(() => { btn.textContent = 'Enviar cumplido'; }, 1500);
}

async function init() {
  for (const person of PEOPLE) {
    const entries = await getEntries(person);
    renderEntries(person, entries);
  }
  await checkAndUpdateStreak();
  await updateStreakBanner();

  document.getElementById('btn-tanya').addEventListener('click', () => submitCompliment('tanya'));
  document.getElementById('btn-saul').addEventListener('click', () => submitCompliment('saul'));

  document.getElementById('resetLink').addEventListener('click', async () => {
    if (!confirm('¿Seguro que quieres borrar toda la racha y los cumplidos?')) return;
    await saveEntries('tanya', []);
    await saveEntries('saul', []);
    await saveStreakData({ streak: 0, lastCompleteDate: null });
    location.reload();
  });
}

init();

/* ---------------- PWA install logic ---------------- */

let deferredPrompt = null;
const overlay = document.getElementById('installOverlay');

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function dismissedRecently() {
  const dismissedAt = localStorage.getItem('installDismissedAt');
  if (!dismissedAt) return false;
  const days = (Date.now() - Number(dismissedAt)) / 86400000;
  return days < 3;
}

function closeInstallPopup(remember) {
  overlay.innerHTML = '';
  if (remember) localStorage.setItem('installDismissedAt', String(Date.now()));
}

function showAndroidPopup() {
  overlay.innerHTML = `
    <div class="install-overlay">
      <div class="install-card">
        <div class="install-icon-row">
          <img src="icon-192.png" alt="ícono">
          <div>
            <h3>Instalar Racha de Cumplidos</h3>
            <p>Agrégala a tu pantalla de inicio para abrirla como una app</p>
          </div>
        </div>
        <div class="install-actions">
          <button class="btn-secondary" id="installLater">Ahora no</button>
          <button id="installNow">Instalar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('installLater').addEventListener('click', () => closeInstallPopup(true));
  document.getElementById('installNow').addEventListener('click', async () => {
    closeInstallPopup(false);
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    }
  });
}

function showIOSPopup() {
  overlay.innerHTML = `
    <div class="install-overlay">
      <div class="install-card">
        <div class="install-icon-row">
          <img src="icon-192.png" alt="ícono">
          <div>
            <h3>Instalar Racha de Cumplidos</h3>
            <p>Agrégala a tu pantalla de inicio para abrirla como una app</p>
          </div>
        </div>
        <div class="install-steps">
          <div class="step"><span class="step-num">1</span> Toca el botón <b>Compartir</b> ⬆️ en Safari</div>
          <div class="step"><span class="step-num">2</span> Elige <b>"Añadir a pantalla de inicio"</b></div>
          <div class="step"><span class="step-num">3</span> Toca <b>"Añadir"</b> arriba a la derecha</div>
        </div>
        <div class="install-actions">
          <button id="installGotIt">Entendido</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('installGotIt').addEventListener('click', () => closeInstallPopup(true));
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone() && !dismissedRecently()) {
    showAndroidPopup();
  }
});

window.addEventListener('appinstalled', () => {
  closeInstallPopup(true);
});

// iOS has no beforeinstallprompt, so show manual instructions
window.addEventListener('load', () => {
  if (isStandalone() || dismissedRecently()) return;
  if (isIOS()) {
    setTimeout(showIOSPopup, 800);
  }
  // Android/desktop Chrome: handled by beforeinstallprompt above.
  // Fallback: if beforeinstallprompt never fires after a few seconds
  // (e.g. already installable criteria not met yet, or unsupported browser),
  // we simply don't show anything extra to avoid nagging.
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
